[package]
name = "mcpm"
version = "1.4.0"
edition = "2024"
description = "MCP Server Manager — terminal dashboard for all your MCP servers across all clients"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

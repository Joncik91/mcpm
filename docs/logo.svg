<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="mcpm">
  <title>mcpm</title>
  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!--
    One central manager (filled circle) with 6 tentacle-arms reaching
    out to 6 small client boxes. Stylized octopus/hub vocabulary —
    "one manager, many clients."

    Tentacles use slight curves to feel organic, not radial spokes.
    Boxes are small filled squares at the tentacle tips.
  -->

  <!-- Tentacles: gently curved strokes from centre out to the 6 boxes -->
  <g fill="none" stroke="#E8954A" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-left -->
    <path d="M 200 200 Q 150 170 100 110"/>
    <!-- Top-right -->
    <path d="M 200 200 Q 250 170 300 110"/>
    <!-- Mid-left -->
    <path d="M 200 200 Q 130 200 70 220"/>
    <!-- Mid-right -->
    <path d="M 200 200 Q 270 200 330 220"/>
    <!-- Bottom-left -->
    <path d="M 200 200 Q 150 240 100 304"/>
    <!-- Bottom-right -->
    <path d="M 200 200 Q 250 240 300 304"/>
  </g>

  <!-- Six small client boxes at tentacle tips -->
  <g fill="#E8954A">
    <rect x="80"  y="92"  width="32" height="22" rx="3"/>
    <rect x="288" y="92"  width="32" height="22" rx="3"/>
    <rect x="50"  y="208" width="32" height="22" rx="3"/>
    <rect x="318" y="208" width="32" height="22" rx="3"/>
    <rect x="80"  y="290" width="32" height="22" rx="3"/>
    <rect x="288" y="290" width="32" height="22" rx="3"/>
  </g>

  <!-- Central hub: filled circle at the centre, slightly larger so it
       reads as "the manager" rather than just another node -->
  <circle cx="200" cy="200" r="28" fill="#E8954A"/>
</svg>
